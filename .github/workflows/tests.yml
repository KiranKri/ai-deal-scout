name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "logs/**"
      - "data/websearch_state.json"
      - "data/telegram_offset.json"
      - "data/run_quota.json"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -q
