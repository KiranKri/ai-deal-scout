name: Telegram Commands

# Answers /start, /stop and /help without any always-on server.
#
# Telegram queues undelivered updates for 24 hours, so polling on a schedule
# is sufficient for a bot whose main job runs twice a day.  Subscribers wait
# up to ~10 minutes for a confirmation, which is an acceptable trade for
# needing no VPS, no Render and no laptop.
#
# The update cursor and subscriber list are committed back, because the
# runner is destroyed after every job.

on:
  schedule:
    # Every 15 minutes. Each run costs Actions minutes, which are unlimited
    # on a public repo but capped at 2,000/month on a private one — at 10-min
    # polling that cap is reached in ~17 days. 15 minutes keeps a private repo
    # comfortably inside the free tier while barely changing how long a new
    # subscriber waits for their /start confirmation.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Two overlapping runs would double-answer commands and race on the commit.
concurrency:
  group: telegram-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-bot.txt

      # Only the HTTP client and .env loader — not the scraping stack or the
      # webhook server. Combined with the pip cache this is the difference
      # between ~40s and ~10s per run, across ~96 runs a day.
      - name: Install dependencies
        run: pip install -r requirements-bot.txt

      - name: Answer queued Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO_DATA: ${{ secrets.GH_REPO_DATA }}
        run: python bot/drain.py

      # Only the read cursor and /run rate-limit state are committed here.
      # Subscriber chat IDs live in the PRIVATE repo behind GH_REPO_DATA and
      # must never land in this one, which is intended to be public.
      # The `|| true` covers the bootstrap case where a file does not exist
      # yet (no updates handled / no /run issued so far).
      - name: Commit cursor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/telegram_offset.json 2>/dev/null || true
          git add data/run_quota.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: telegram state [skip ci]"
          git pull --rebase origin main
          git push
